# Opens pull requests to update the dependencies. The Check workflow runs on them, so an update
# that breaks the app is noticed before it is merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # It is on React 17 with Material-UI 4, moving to a new React needs changes to the code
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    groups:
      e2e:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
