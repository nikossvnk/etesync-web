name: Release

# Pushing a version tag (e.g. v0.7.0) checks and builds the app, and publishes the build as a
# release: etesync-web-<version>.tgz, to serve from any web server, with its checksum.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Check that the version of the app is the one of the tag
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$TAG" ]; then
            echo "package.json has version $version, but the tag is $TAG" >&2
            exit 1
          fi

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build

      - name: Package
        run: |
          name="etesync-web-${TAG#v}"
          # Without the source maps, which are only of use for development
          find build -name '*.map' -delete
          mv build "$name"
          tar -czf "$name.tgz" "$name"
          sha256sum "$name.tgz" > "$name.tgz.sha256"
          echo "FILE=$name.tgz" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$FILE" "$FILE.sha256" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
